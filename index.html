<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>晨丽全屋定制</title>
<style>
:root{--pri:#166b45;--prid:#0f4d31;--bg:#f2f5f3;--card:#fff;--line:#dfe7e3;--txt:#22312b;--mut:#7d8c85;--amber:#fff7e6;--amberbd:#f0d48a;--red:#c0392b}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);font-size:14px;line-height:1.55;-webkit-text-size-adjust:100%}
header.top{position:sticky;top:0;z-index:60;background:var(--prid);color:#fff;padding:10px 12px}
header.top .t1{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
header.top h1{font-size:17px;font-weight:700}
header.top .sub{font-size:11px;opacity:.75}
.topbtns{display:flex;gap:6px}
.backupbar{background:var(--amber);border-bottom:1px solid var(--amberbd);color:#8a6414;font-size:12px;padding:7px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.folderbar{background:#e8f5e9;border-bottom:1px solid #c8e6c9;color:#2e7d32;font-size:12px;padding:7px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
nav.tabs{position:sticky;top:0;z-index:55;background:#fff;border-bottom:1px solid var(--line);display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch}
nav.tabs button{flex:1 0 auto;border:0;background:none;padding:11px 14px;font-size:14px;color:var(--mut);border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer}
nav.tabs button.on{color:var(--pri);border-bottom-color:var(--pri);font-weight:700}
main{max-width:none;width:100%;margin:0 auto;padding:12px 20px 80px;box-sizing:border-box}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(20,60,40,.06)}
.card h2{font-size:15px;margin-bottom:10px;color:var(--prid)}
.card h3{font-size:14px;margin:12px 0 8px;color:var(--prid)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.f{display:block;margin-bottom:10px}
label.f>span{display:block;font-size:12px;color:var(--mut);margin-bottom:4px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fff;color:var(--txt)}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid #bfe3cf;border-color:var(--pri)}
.btn{display:inline-block;border:1px solid var(--line);background:#fff;color:var(--txt);border-radius:8px;padding:9px 14px;font-size:14px;cursor:pointer;text-decoration:none}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:700}
.btn.danger{background:#fff;border-color:var(--red);color:var(--red)}
.btn.warn{background:#fff8e6;border-color:var(--amberbd);color:#8a6414}
.btn.sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.5}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th,table.tbl td{border:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
table.tbl th{background:#f4faf6;color:var(--prid);font-weight:700;white-space:nowrap}
table.tbl td input,table.tbl td select{padding:5px 6px;font-size:13px;border:1px solid #e6ece9}
table.tbl td textarea{padding:5px 6px;font-size:14px;border:1px solid #e6ece9;line-height:1.4;vertical-align:top}
table.tbl td{vertical-align:top}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -14px;padding:0 14px}
.r{text-align:right!important;white-space:nowrap}
.mut{color:var(--mut);font-size:12px}
.tot{background:#f4faf6;font-weight:700}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:#eef4f0;color:var(--pri);border:1px solid #d5e8db}
.badge.gray{background:#f1f3f2;color:var(--mut);border-color:#e2e6e4}
.badge.red{background:#fdecea;color:var(--red);border-color:#f5c6c0}
.checkgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.checkgrid button{aspect-ratio:1;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:11px;cursor:pointer;padding:2px}
.checkgrid button.done{background:var(--pri);color:#fff;border-color:var(--pri)}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.thumb{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fafafa}
.thumb img{width:100%;height:110px;object-fit:cover;display:block}
.thumb button{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.55);color:#fff;border:0;border-radius:6px;font-size:11px;padding:3px 7px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#22312b;color:#fff;padding:10px 18px;border-radius:8px;font-size:14px;z-index:99;display:none}
#printArea{display:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:999;padding:16px}
.modal .mbox{background:#fff;border-radius:12px;max-width:520px;width:100%;max-height:80vh;overflow:auto;padding:18px}
.modal .mbox h3{margin:0 0 12px}
@media print{
  header.top,.backupbar,.folderbar,nav.tabs,main,.toast,#importFile{display:none!important}
  #printArea{display:block!important}
  body{background:#fff}
  .psheet{max-width:760px;margin:0 auto;color:#000;font-size:13px}
  .psheet h1{font-size:20px;text-align:center;margin:6px 0}
  .psheet .pmeta{display:flex;justify-content:space-between;flex-wrap:wrap;margin:8px 0;font-size:13px}
  .psheet table{width:100%;border-collapse:collapse;font-size:12px;margin:8px 0}
  .psheet th,.psheet td{border:1px solid #333;padding:5px 6px;text-align:left}
  .psheet .pr{text-align:right}
  .psheet .psign{display:flex;justify-content:space-between;margin-top:26px}
  .psheet .pnote{font-size:12px;margin-top:10px;white-space:pre-line}
  .psheet .pfoot{text-align:center;margin-top:22px;font-size:13px}
  .psheet tr{page-break-inside:avoid}
  .psheet thead{display:table-header-group}
  .psheet table{page-break-inside:auto}
}
@media(max-width:640px){
  .grid2{grid-template-columns:1fr}
  main{padding:10px 8px 70px}
  .checkgrid{grid-template-columns:repeat(7,1fr)}
  .thumbs{grid-template-columns:repeat(2,1fr)}
}
/* ============ 手机专用版 ============ */
@media(max-width:768px){
  /* 基础 */
  body{font-size:15px;-webkit-tap-highlight-color:transparent}
  main{padding:10px 8px 90px !important}
  h1{font-size:19px !important}
  h2{font-size:17px !important}
  h3{font-size:16px !important}

  /* 顶部栏 */
  header.top .t1{flex-direction:column;align-items:flex-start;gap:8px}
  .topbtns{display:flex;gap:8px;width:100%}
  .topbtns .btn{flex:1}

  /* 导航标签 - 更大的触控区 */
  nav.tabs button{padding:12px 16px !important;font-size:15px !important;min-height:48px;white-space:nowrap}

  /* 按钮 - 手指友好 */
  .btn{min-height:44px;padding:10px 16px;font-size:15px}
  .btn.sm{min-height:40px;padding:8px 12px;font-size:14px}

  /* 表单 - 垂直堆叠 */
  .grid2,.grid3,.grid4{grid-template-columns:1fr !important}
  input[type=text],input[type=number],input[type=date],select,textarea{
    min-height:44px;font-size:16px !important;padding:10px 12px;width:100%;box-sizing:border-box
  }
  label{display:block;margin-bottom:4px;font-weight:bold}

  /* 表格 - 横向滚动 */
  .tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -8px;padding:0 8px}
  table{font-size:13px;min-width:600px}
  table th,table td{padding:8px 6px;white-space:nowrap}
  table input,table select{min-height:40px;font-size:14px !important}

  /* 卡片 */
  .card{margin:8px 0;padding:12px;border-radius:10px}
  .kpi{grid-template-columns:repeat(2,1fr) !important;gap:8px}
  .kpi .v{font-size:20px}

  /* 报价编辑器 - 关键优化 */
  .qedit table{min-width:800px}
  .qedit .toolbar{flex-wrap:wrap;gap:8px}
  .qedit .toolbar .btn{flex:1 1 45%}

  /* 跟进/弹窗 */
  .modal{width:94% !important;max-width:94% !important;left:3% !important;margin:0}
  .modal .body{max-height:70vh;overflow-y:auto}

  /* 底部安全区 */
  .bottombar{padding-bottom:env(safe-area-inset-bottom)}
}

</style>
</head>
<body>
<header class="top">
  <div class="t1">
    <div><h1>晨丽定制管理系统</h1><div class="sub">单机版 · 双击即用 · 数据存本机</div></div>

  </div>
</header>

<div class="folderbar" id="folderBar" style="display:none"></div>
<nav class="tabs" id="tabs"></nav>
<main id="app"></main>
<div id="printArea"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<div class="toast" id="toast"></div>
<script>
'use strict';
/* ============ 工具 ============ */
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(v);return isNaN(n)?0:n};
const fmt=n=>'¥'+Number(n||0).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt3=n=>Number(n||0).toFixed(3);
const uid=p=>(p||'')+Date.now().toString(36)+Math.floor(Math.random()*1e6).toString(36);
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const monthStr=()=>todayStr().slice(0,7);
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',2200)}

/* ============ 数据层 ============ */
const DBKEY='chenli_erp_db_v1';
let DB=null;
function loadDB(){
  try{const s=localStorage.getItem(DBKEY);if(s){DB=JSON.parse(s);if(DB&&DB.settings){migrateDB();backfillQR();return;}}}catch(e){}
  DB=seedDB();
  /* 新设备首次打开：只放内存里，不立即存入/推送，等 fbAutoInit 拉取云端数据。
     否则种子默认数据会抢先推送到云端，覆盖掉你之前删掉的库内容。 */
}
/* 老用户数据迁移：补上新增的库；导入备份时也做一次兜底 */
function migrateDB(){
  if(!DB.extraLib)DB.extraLib=seedExtraLib();
  else{const have={};DB.extraLib.forEach(e=>have[e.name]=1);
    seedExtraLib().forEach(s=>{if(!have[s.name])DB.extraLib.push(s);});}
  if(!DB.products)DB.products=seedProducts();
  else{var ph={};DB.products.forEach(function(p){ph[p.name]=1;});seedProducts().forEach(function(s){if(!ph[s.name])DB.products.push(s);});}
  if(!DB.settings)DB.settings={};
  if(DB.settings.downPayRatio==null)DB.settings.downPayRatio=50;
  if(!DB.settings.configNote)DB.settings.configNote='柜体板之佳实木多层板 • 柜门梦牌欧松板肤感门 • 悍高五金';
  if(!Array.isArray(DB.settings.configNotes))DB.settings.configNotes=[{id:'cn1',name:'标准定制',text:'柜体板之佳实木多层板 • 柜门梦牌欧松板肤感门 • 悍高五金'}];
  if(!Array.isArray(DB.contracts))DB.contracts=[];
  if(!Array.isArray(DB.payments))DB.payments=[];
  if(!Array.isArray(DB.media))DB.media=[];
  if(Array.isArray(DB.quotes))DB.quotes.forEach(q=>{if(!q.category)q.category=(q.no||'').indexOf('CL-ZX-')===0?'zx':'dz';});
  if(Array.isArray(DB.quotes))DB.quotes.forEach(q=>{if(!Array.isArray(q.follows))q.follows=[];});
  if(Array.isArray(DB.quotes))DB.quotes.forEach(q=>{(q.items||[]).forEach(r=>{if(!r.cat)r.cat='dz';});});
  if(!Array.isArray(DB.customers))DB.customers=[];
  if(!Array.isArray(DB.projects))DB.projects=[];
  if(!DB.checkins)DB.checkins={};
  if(!DB.reviews)DB.reviews={};
  if(Array.isArray(DB.projects))DB.projects.forEach(p=>{ if(!p.progress)p.progress={}; });
  /* 默认银行信息与云配置：老用户空字段自动补上 */
  if(DB.settings){
    if(!DB.settings.bankName)DB.settings.bankName='农业银行（南海大沥支行）';
    if(!DB.settings.bankAccount)DB.settings.bankAccount='6228 4814 6524 3396 813';
    if(!DB.settings.bankHolder)DB.settings.bankHolder='李志勤';
    if(!DB.settings.fbConfig)DB.settings.fbConfig='{"apiKey":"AIzaSyCLNuFiglsXvfdRd_RXOeE94VqPENP0MDA","authDomain":"chenli-erp.firebaseapp.com","projectId":"chenli-erp","storageBucket":"chenli-erp.firebasestorage.app","messagingSenderId":"924770441461","appId":"1:924770441461:web:620bddfbf114ad3d08cdbc"}';
  }
  try{saveDB(true);}catch(e){}
}
/* 老用户补收款码：种子里有、本地为空时自动填入 */
function backfillQR(){
  try{
    const seed=seedDB().settings||{};
    /* 收款码损坏自动恢复：有值但过短（<20KB）视为损坏 */
    if(DB.settings.payWx&&DB.settings.payWx.length<20000)DB.settings.payWx='';
    if(DB.settings.payAli&&DB.settings.payAli.length<20000)DB.settings.payAli='';
    if(!DB.settings.payWx&&seed.payWx)DB.settings.payWx=seed.payWx;
    if(!DB.settings.payAli&&seed.payAli)DB.settings.payAli=seed.payAli;
    saveDB(true);
  }catch(e){}
}
function saveDB(silent){
  try{localStorage.setItem(DBKEY,JSON.stringify(DB));}
  catch(e){if(!silent)alert('存储空间已满！请先点右上角「导出备份」保存数据，再删除部分照片后重试。');return false;}
  writeToFolder();
  fbPush();
  return true;
}
function exportBackup(){
  try{
    const blob=new Blob([JSON.stringify(DB)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download='晨丽ERP备份_'+todayStr()+'.json';document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),5000);
    DB.settings.lastBackup=new Date().toISOString();saveDB(true);renderBackupBar();
    toast('备份已下载到本机');
    if(confirm('备份文件已下载到本机。\n\n浏览器不能直接把文件写进谷歌云盘，需要手动上传这一步。\n现在就打开云盘去上传吗？'))openDrive();
  }catch(e){alert('导出失败：'+e.message);}
}
function importBackup(file){
  const r=new FileReader();
  r.onload=()=>{try{
    const d=JSON.parse(r.result);
    if(!d||!d.settings||!Array.isArray(d.quotes))throw new Error('bad');
    if(confirm('导入将覆盖本机全部数据，确定吗？')){DB=d;migrateDB();if(saveDB())location.reload();}
  }catch(e){alert('备份文件无效，导入失败');}};
  r.readAsText(file);
}
document.getElementById('importFile').addEventListener('change',e=>{if(e.target.files[0])importBackup(e.target.files[0]);e.target.value='';});
function renderBackupBar(){/* 备份条已移除，备份功能在设置页 */}

/* ============ 数据文件夹模式（电脑Chrome） ============
   把"晨丽ERP数据.json"存在用户指定的本地文件夹（可放在谷歌云盘同步目录），
   每次保存直接写入文件，云盘桌面版自动同步。file:// 下权限不持久，
   每次打开文件后需点一下"加载数据文件夹"。（手机浏览器不支持） */
const DATA_FILENAME='晨丽ERP数据.json';
let folderHandle=null;
let __writeChain=Promise.resolve();
function fsSupported(){ return (typeof window!=='undefined')&&!!window.showDirectoryPicker; }
function folderModeOn(){ return !!(DB&&DB.settings&&DB.settings.folderMode); }
function idbOpen(){
  return new Promise((res,rej)=>{
    try{
      const r=indexedDB.open('chenli-erp',1);
      r.onupgradeneeded=()=>{ r.result.createObjectStore('kv'); };
      r.onsuccess=()=>res(r.result);
      r.onerror=()=>rej(r.error||new Error('idb'));
    }catch(e){ rej(e); }
  });
}
async function idbSet(k,v){
  const db=await idbOpen();
  return new Promise((res,rej)=>{
    const t=db.transaction('kv','readwrite');
    t.objectStore('kv').put(v,k);
    t.oncomplete=()=>{ try{db.close();}catch(e){} res(); };
    t.onerror=()=>rej(t.error||new Error('idb'));
  });
}
async function idbGet(k){
  const db=await idbOpen();
  return new Promise((res,rej)=>{
    const t=db.transaction('kv','readonly');
    const q=t.objectStore('kv').get(k);
    q.onsuccess=()=>{ try{db.close();}catch(e){} res(q.result); };
    q.onerror=()=>rej(q.error||new Error('idb'));
  });
}
async function idbDel(k){
  const db=await idbOpen();
  return new Promise((res,rej)=>{
    const t=db.transaction('kv','readwrite');
    t.objectStore('kv').delete(k);
    t.oncomplete=()=>{ try{db.close();}catch(e){} res(); };
    t.onerror=()=>rej(t.error||new Error('idb'));
  });
}
async function pickFolder(){
  if(!fsSupported()){ alert('当前浏览器不支持选择文件夹，请用电脑版Chrome打开'); return; }
  let h=null;
  try{ h=await window.showDirectoryPicker({mode:'readwrite'}); }
  catch(e){ if(e&&e.name!=='AbortError')alert('选择文件夹失败：'+(e.message||e)); return; }
  if(!h)return;
  folderHandle=h;
  DB.settings.folderMode=true;
  DB.settings.folderName=h.name||'';
  try{ await idbSet('folderHandle',h); }catch(e){}
  saveDB(true);
  try{ await __writeChain; }catch(e){}
  const ok=await loadFromFolder(true);
  renderFolderBar(); if(curTab==='set')renderSet();
  toast(ok?'已连接数据文件夹':'已选择文件夹');
}
/* 从文件夹读取；initial=true 且文件夹为空时把当前数据写进去 */
async function loadFromFolder(initial){
  if(!folderHandle)return false;
  try{
    let perm='granted';
    try{ perm=await folderHandle.queryPermission({mode:'readwrite'}); }catch(e){}
    if(perm!=='granted'){
      perm=await folderHandle.requestPermission({mode:'readwrite'});
      if(perm!=='granted')return false;
    }
    let fh=null;
    try{ fh=await folderHandle.getFileHandle(DATA_FILENAME,{create:false}); }
    catch(e){ if(initial){ await writeToFolderNow(); return true; } return false; }
    const f=await fh.getFile();
    const d=JSON.parse(await f.text());
    if(!d||!d.settings||!Array.isArray(d.quotes))return false;
    DB=d; migrateDB();
    try{ localStorage.setItem(DBKEY,JSON.stringify(DB)); }catch(e){}
    return true;
  }catch(e){ return false; }
}
function writeToFolderNow(){
  if(!folderHandle)return Promise.resolve(false);
  __writeChain=__writeChain.then(async ()=>{
    try{
      const fh=await folderHandle.getFileHandle(DATA_FILENAME,{create:true});
      const w=await fh.createWritable();
      await w.write(JSON.stringify(DB));
      await w.close();
      return true;
    }catch(e){ return false; }
  });
  return __writeChain;
}
/* 每次保存顺带写入文件夹（异步串行，不阻塞界面） */
function writeToFolder(){
  if(!folderModeOn()||!folderHandle)return;
  writeToFolderNow();
}
async function disconnectFolder(){
  if(!confirm('断开数据文件夹吗？之后改回只存浏览器本机。'))return;
  folderHandle=null;
  DB.settings.folderMode=false; DB.settings.folderName='';
  try{ await idbDel('folderHandle'); }catch(e){}
  saveDB(true);
  renderFolderBar(); renderSet();
  toast('已断开，改回浏览器本机存储');
}
/* 打开文件时尝试静默恢复；不行就显示横条让用户点一下 */
async function initFolderMode(){
  renderFolderBar();
  if(!fsSupported())return;
  if(!folderModeOn())return;
  try{
    const h=await idbGet('folderHandle');
    if(h){
      folderHandle=h;
      let perm='prompt';
      try{ perm=await h.queryPermission({mode:'readwrite'}); }catch(e){}
      if(perm==='granted'&&await loadFromFolder(false)){
        toast('已从数据文件夹加载');
        go(curTab); renderFolderBar();
        return;
      }
    }
  }catch(e){}
  renderFolderBar();
}
/* 横条按钮：用户手势，可请求权限；先试存过的 handle，不行再重新选 */
async function manualLoadFolder(){
  try{
    const h=folderHandle||await idbGet('folderHandle');
    if(h){
      folderHandle=h;
      let req='denied';

/* ============ Firebase 云同步（免费版） ============
   设置里粘贴 Firebase 配置后启用：数据存 Firestore，文件存 Storage。
   未配置时完全不影响本机使用。 */
let fbApp=null,fbDb=null,fbStorage=null,fbReady=false,fbPushTimer=null,fbPushing=false;
function fbCfg(){
  let t=(DB.settings.fbConfig||'').trim();
  if(!t)return null;
  t=t.replace(/^(const|let|var)\s+[\w$]+\s*=\s*/,'').replace(/;+\s*$/,'');
  try{const c=JSON.parse(t);if(c&&c.apiKey&&c.projectId)return c;}catch(e){}
  try{
    const c=JSON.parse(t.replace(/([{,]\s*)([A-Za-z_$][\w$]*)\s*:/g,'$1"$2":'));
    if(c&&c.apiKey&&c.projectId)return c;
  }catch(e){}
  return null;
}
function loadFbSdk(){
  if(typeof firebase!=='undefined'&&firebase.firestore)return Promise.resolve(true);
  const urls=[
    'https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js',
    'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js',
    'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js',
    'https://www.gstatic.com/firebasejs/10.12.0/firebase-storage-compat.js'
  ];
  return urls.reduce((p,u)=>p.then(()=>new Promise((res,rej)=>{
    const s=document.createElement('script');s.src=u;s.onload=()=>res();s.onerror=()=>rej(new Error('组件加载失败'));
    document.head.appendChild(s);
  })),Promise.resolve()).then(()=>true);
}
async function fbInit(silent){
  fbReady=false;
  /* 公开更新页面禁用云同步，防止陌生人访问数据库 */
  if(location.hostname.indexOf('github.io')>=0){fbReady=false;return false;}
  const cfg=fbCfg(); if(!cfg)return false;
  try{
    await loadFbSdk();
    fbApp=firebase.apps.length?firebase.app():firebase.initializeApp(cfg);
    await firebase.auth().signInAnonymously();
    fbDb=firebase.firestore();
    try{ fbStorage=firebase.storage(); }catch(e){ fbStorage=null; }
    await fbDb.collection('chenli').doc('meta').get();
    fbReady=true;
    if(!silent)toast('云端连接成功');
    return true;
  }catch(e){
    if(!silent)alert('云端连接失败：'+(e.message||e));
    return false;
  }
}
/* 保存后防抖推送云端（数据超900KB则跳过，避免超限） */
function fbPush(){
  if(!fbReady||!fbDb)return;
  clearTimeout(fbPushTimer);
  fbPushTimer=setTimeout(async ()=>{
    if(fbPushing)return; fbPushing=true;
    try{
      /* 文件/收款码不进云端：只同步业务数据，保证报价/客户/项目始终能同步 */
      const cloudSettings=Object.assign({},DB.settings,{payWx:'',payAli:''});
      const cloudDB=Object.assign({},DB,{media:[],settings:cloudSettings});
      const json=JSON.stringify(cloudDB);
      if(json.length>900*1024){ console.warn('数据过大，跳过云同步'); fbPushing=false; return; }
      const pushMs=Date.now();
      await fbDb.collection('chenli').doc('maindb').set({data:json,updatedAtMs:pushMs});
      DB.settings.lastCloudPush=new Date().toISOString();DB.settings._lastPushMs=pushMs;
    }catch(e){ console.warn('云同步失败',e); }
    fbPushing=false;
  },2500);
}
/* 打开时若云端更新则拉取 */
async function fbPull(){
  if(!fbReady||!fbDb)return false;
  try{
    const doc=await fbDb.collection('chenli').doc('maindb').get();
    if(!doc.exists)return false;
    const r=doc.data()||{};
    const remoteTs=r.updatedAtMs||0, localTs=DB.settings.lastCloudTs||0;
    if(remoteTs>localTs){
      const d=JSON.parse(r.data);
      if(d&&d.settings&&Array.isArray(d.quotes)){
        d.settings.lastCloudTs=remoteTs;
        const localMedia=DB.media||[]; /* 文件存本机，不随云端覆盖 */
        const localWx=DB.settings.payWx, localAli=DB.settings.payAli; /* 收款码本机为准 */
        DB=d; DB.media=localMedia;
        if(localWx)DB.settings.payWx=localWx;
        if(localAli)DB.settings.payAli=localAli;
        migrateDB();
        try{localStorage.setItem(DBKEY,JSON.stringify(DB));}catch(e){}
        return true;
      }
    }
  }catch(e){ console.warn('云拉取失败',e); }
  return false;
}

/* ============ 计价核心（必须精确） ============
   自动：宽≥1000 且 高≥1000 → 投影面积=宽×高/1e6(㎡)；否则 长边=max(宽,高)/1000(m)
   增项：按数量。手动：area=投影面积，length=延米，qty=按数量 */
function calcRow(r){
  const w=num(r.w),h=num(r.h),qty=num(r.qty)||0,up=num(r.unitPrice);
  let base=0,unit=r.unit||'项',modeLabel='';
  const hasDim=w>0&&h>0;
  const qtyMode=(r.mode==='qty')||!hasDim; /* 没填尺寸一律按数量，避免算出0 */
  if(qtyMode){base=qty;modeLabel=r.extra?'增项·按量':'按数量';}
  else if(r.mode==='area'){base=w*h/1e6;unit='㎡';modeLabel='投影面积';}
  else if(r.mode==='length'){base=Math.max(w,h)/1000;unit='m';modeLabel='延米';}
  else{if(w>=1000&&h>=1000){base=w*h/1e6;unit='㎡';modeLabel='投影面积';}else{base=Math.max(w,h)/1000;unit='m';modeLabel='延米';}}
  const mult=qtyMode?1:(num(r.qty)||1);
  const amount=Math.round(base*up*mult*100)/100; /* 每行先四舍五入到分，再汇总 */
  return{base,unit,modeLabel,amount,qtyMult:mult};
}
/* 报价跟进：距报价日期天数 */
function quoteFollowDays(q){
  if(!q||!q.date)return 0;
  const d1=new Date(q.date+'T00:00:00'), d2=new Date();
  d2.setHours(0,0,0,0);
  return Math.max(0, Math.round((d2-d1)/86400000));
}
function followBadge(q){
  if(!q||q.status!=='未下单')return '';
  const d=quoteFollowDays(q);
  if(d>=7)return '<span class="badge red">急需跟进·'+d+'天</span>';
  if(d>=3)return '<span class="badge" style="background:#fff3cd;color:#856404">跟进·'+d+'天</span>';
  return '<span class="mut">'+d+'天</span>';
}
function quoteTotals(items,discount){
  let total=0,extraSum=0,areaSum=0,lenSum=0;
  for(const r of items){const c=calcRow(r);total+=c.amount;
    if(r.extra){extraSum+=c.amount;}
    else{if(c.unit==='㎡')areaSum+=c.base*c.qtyMult;else if(c.unit==='m')lenSum+=c.base*c.qtyMult;}
  }
  const disc=num(discount)==0?100:num(discount);
  const payable=total*disc/100;
  return{total,extraSum,areaSum,lenSum,payable,disc,
    earnest:num(DB.settings.earnestDefault),
    down:payable*(num(DB.settings.downPayRatio)==0?50:num(DB.settings.downPayRatio))/100-num(DB.settings.earnestDefault),
    tail:payable*(100-(num(DB.settings.downPayRatio)==0?50:num(DB.settings.downPayRatio)))/100};
}

}

/* ============ 路由 ============ */
const TABS=[['dash','工作台'],['cust','客户项目'],['quote','报价'],['contract','合同'],['pay','收付款'],['media','图片档案'],['check','打卡复盘'],['set','设置']];
let curTab='dash';
function renderTabs(){$('#tabs').innerHTML=TABS.map(t=>'<button class="'+(t[0]===curTab?'on':'')+'" onclick="go(\''+t[0]+'\')">'+t[1]+'</button>').join('')}
function go(t){curTab=t;renderTabs();({dash:renderDash,cust:renderCust,quote:renderQuoteList,contract:renderContract,pay:renderPay,media:renderMedia,check:renderCheck,set:renderSet})[t]()}
const custName=id=>{const c=DB.customers.find(x=>x.id===id);return c?c.name:'—'};
const projName=id=>{const p=DB.projects.find(x=>x.id===id);return p?(p.community+' '+(p.houseNo||'')):'—'};
const quotePaid=qid=>DB.payments.filter(p=>p.quoteId===qid).reduce((s,p)=>s+num(p.amount),0);

/* ============ 工作台 ============ */
function renderDash(){
  let unpaid=0;const rows=[];
  for(const q of DB.quotes){
    const t=quoteTotals(q.items,q.discount);const paid=quotePaid(q.id);const rest=t.payable-paid;
    if(rest>0.005&&q.status!=='已作废'){unpaid+=rest;rows.push({q,rest});}
  }
  rows.sort((a,b)=>b.rest-a.rest);

/* ============ 项目进度阶段 ============ */
const PROJ_STAGES=[
  {k:'measure',t:'量尺'},{k:'design',t:'设计'},{k:'quote',t:'报价'},{k:'order',t:'下单'},
  {k:'produce',t:'生产'},{k:'deliver',t:'送货安装'},{k:'paid',t:'收尾款'},{k:'done',t:'完工'}
];
function projProgress(p){
  const pr=(p&&p.progress)||{};
  const done=PROJ_STAGES.filter(s=>pr[s.k]).length;
  const cur=PROJ_STAGES.find(s=>!pr[s.k]);
  return {done:done,total:PROJ_STAGES.length,cur:cur?cur.t:'完工'};
}

/* 公式计算：支持 1200+300、(1500-200)x2 等；只允许数字和加减乘除括号，其余一律无效 */
function evalFormula(s){
  s=String(s==null?'':s).trim().replace(/×/g,'*').replace(/÷/g,'/').replace(/．/g,'.').replace(/。/g,'.');
  if(!s||!/^[\d\s+\-*/().]+$/.test(s))return NaN;
  if(/^\d+(\.\d+)?$/.test(s))return parseFloat(s); /* 纯数字直接返回，不依赖动态函数 */
  try{
    const v=Function('"use strict";return ('+s+')')();
    if(typeof v!=='number'||!isFinite(v)||v<0)return NaN;
    return Math.round(v*1000000)/1000000;
  }catch(e){return NaN;}
}
/* 读取数字格：保留原文显示；公式没写完时沿用上次数值（输入过程不闪零） */
function readNumCell(r,key,prefix){
  const el=document.getElementById(prefix+r.id);if(!el)return;
  const raw=el.value;r[key+'Raw']=raw;
  const v=evalFormula(raw);if(!isNaN(v))r[key]=v;
}
function dispRaw(r,key){const raw=r[key+'Raw'];return (raw!=null&&raw!=='')?raw:(r[key]||'');}
/* 公式失焦归一化：1+1 → 2（只改显示，数据已正确） */
function qBlurNorm(el){
  const raw=(el.value||'').trim(), v=evalFormula(raw);
  if(raw&&!isNaN(v)&&raw!==String(v))el.value=String(v);
}
/* Tab 在明细行内按顺序跳转（不受重渲染干扰） */
function qTabOrder(){
  const els=[];
  if(!qEdit||!qEdit.items)return els;
  for(const r of qEdit.items){
    for(const p of ['sp_','nm_','w_','h_','d_','q_','m_','u_','p_','n_']){
      const el=document.getElementById(p+r.id);
      if(el)els.push(el);
    }
  }
  return els;
}
function qHandleTab(e){
  if(!e||e.key!=='Tab')return;
  const els=qTabOrder(), i=els.indexOf(e.target);
  if(i<0)return;
  e.preventDefault();
  const nx=els[(i+(e.shiftKey?-1:1)+els.length)%els.length];
  if(nx){nx.focus();try{if(nx.select&&nx.type==='text')nx.select();}catch(_){}}
}

async function saveQuote(){
  if(qSaving)return;qSaving=true;const btn=$('#qSaveBtn');if(btn)btn.disabled=true;
  try{
    qReadRows();
    if(!qEdit.customerId||!qEdit.projectId){alert('请选择客户和项目');return}
    if(!qEdit.no){alert('请填写报价编号');return}
    if(DB.quotes.some(q=>q.no===qEdit.no&&q.id!==qEdit.id)){alert('报价编号重复，请更换');return}
    if(!qEdit.items.length){alert('请至少添加一行明细');return}
    /* 双设备冲突检查：云端在你打开之后被别的设备保存过 */
    if(qEdit.id&&fbReady&&fbDb){
      try{
        const doc=await fbDb.collection('chenli').doc('maindb').get();
        if(doc.exists){
          const cloudTs=(doc.data()||{}).updatedAtMs||0;
          if(cloudTs>(qEdit._openedAt||0)&&cloudTs!==(DB.settings._lastPushMs||0)){
            if(!confirm('另一台设备在你打开之后保存过数据，现在保存会覆盖云端的内容。\n\n确定要覆盖吗？（点"取消"可先下拉刷新再编辑）'))return;
          }
        }
      }catch(e){}
    }
    if(qEdit.id){const i=DB.quotes.findIndex(q=>q.id===qEdit.id);DB.quotes[i]=JSON.parse(JSON.stringify(qEdit));}
    else{qEdit.id=uid('qu');qEdit.createdAt=todayStr();DB.quotes.push(JSON.parse(JSON.stringify(qEdit)));}
    qEdit._openedAt=Date.now();
    if(saveDB()){toast('报价已保存');renderQuoteList();}
  }finally{qSaving=false;if(btn)btn.disabled=false;}
}

/* 金额大写（人民币） */
function rmbUpper(n){
  var D=['零','壹','贰','叁','肆','伍','陆','柒','捌','玖'];
  n=Math.round(Math.abs(parseFloat(n)||0)*100);
  if(n===0)return '零元整';
  var units=['分','角','元','拾','佰','仟','万','拾','佰','仟','亿','拾','佰','仟'];
  var s=String(n), out=[], zero=false, i, pos, d, u, r;
  for(i=0;i<s.length;i++){
    pos=s.length-1-i; d=parseInt(s[i],10); u=units[pos]||'';
    if(d===0){ if(u==='元'||u==='万'||u==='亿')out.push(u); else if(!zero)out.push('零'); zero=true; }
    else{ out.push(D[d]+u); zero=false; }
  }
  r=out.join('').replace(/零+/g,'零').replace(/零(万|亿)/g,'$1').replace(/亿万/g,'亿');
  if(r.charAt(r.length-1)==='零')r=r.slice(0,-1);
  r=r.replace(/零元/,'元').replace(/元零/g,'元');
  if(!/[分角]$/.test(r))r+='整';
  return r;
}

    const href=m.cloudUrl||m.dataUrl||'#';

  }).join(''):'<p class="mut">暂无文件</p>')+

  try{
    const kb=Math.round(JSON.stringify(DB).length/1024), pct=Math.min(99,Math.round(kb/5120*100));
    const el=$('#m_storage');

function handleFiles(files){
  if(!mediaProj){alert('请先选择项目');return}
  Array.from(files).slice(0,10).forEach(f=>{
    if((f.type||'').indexOf('image/')===0){
      const img=new Image();const url=URL.createObjectURL(f);
      img.onload=()=>{
        const max=1280;let w=img.width,h=img.height;
        if(Math.max(w,h)>max){const r=max/Math.max(w,h);w=Math.round(w*r);h=Math.round(h*r);}
        const cv=document.createElement('canvas');cv.width=w;cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        URL.revokeObjectURL(url);
        saveMediaFile({name:f.name,mime:f.type,size:f.size,dataUrl:cv.toDataURL('image/jpeg',0.82)});
      };
      img.onerror=()=>{URL.revokeObjectURL(url);alert('图片读取失败：'+f.name)};
      img.src=url;
    }else{
      if(f.size>8*1024*1024){alert('文件太大（>8MB），跳过：'+f.name);return;}
      if(f.size>3*1024*1024&&!confirm('文件较大（'+Math.round(f.size/1024/1024)+'MB），会占用本机空间，继续上传吗？\n'+f.name))return;
      const r=new FileReader();
      r.onload=()=>saveMediaFile({name:f.name,mime:f.type||'application/octet-stream',size:f.size,dataUrl:r.result});
      r.onerror=()=>alert('文件读取失败：'+f.name);
      r.readAsDataURL(f);
    }
  });
}
/* 保存文件记录：云端就绪时传云存储，否则存本机 */
function saveMediaFile(info){
  const rec=Object.assign({id:uid('md'),projectId:mediaProj,createdAt:todayStr()},info);
  const done=()=>{ DB.media.push(rec); if(saveDB()){toast('文件已保存');renderMedia();} };
  if(fbReady&&fbStorage){
    const path='files/'+mediaProj+'/'+rec.id+'_'+(info.name||'file').replace(/[^\w.\-一-\u9fa5]+/g,'_');
    fbStorage.ref().child(path).put(dataUrlToBlob(info.dataUrl),{contentType:info.mime}).then(snap=>snap.ref.getDownloadURL()).then(url=>{
      rec.cloudUrl=url; delete rec.dataUrl; done();
    }).catch(e=>{ console.warn('云存储上传失败，改存本机',e); done(); });
  }else done();
}
function dataUrlToBlob(dataUrl){
  const arr=dataUrl.split(','),mime=(arr[0].match(/:(.*?);/)||[])[1]||'application/octet-stream';
  const bin=atob(arr[1]);const u8=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
  return new Blob([u8],{type:mime});
}
function delMedia(id){if(!confirm('删除这个文件？'))return;delMediaCloud(id);DB.media=DB.media.filter(x=>x.id!==id);saveDB();renderMedia()}
/* 一键分享文件到WPS/微信等（手机端系统分享） */
async function shareFiles(){
  const list=DB.media.filter(m=>!mediaProj||m.projectId===mediaProj);
  if(!list.length){toast('当前项目暂无文件');return;}
  // 移动端：用系统分享
  let files=[];
  try{
    files=list.filter(m=>m.dataUrl).map(m=>new File([dataUrlToBlob(m.dataUrl)],m.name||'file',{type:m.mime||'application/octet-stream'}));
  }catch(e){ files=[]; }
  if(/Android|iPhone|iPad/i.test(navigator.userAgent) && navigator.canShare && files.length && navigator.canShare({files:files})){
    try{ await navigator.share({files:files,title:'晨丽定制-项目文件'}); return; }
    catch(e){ if(e&&e.name!=='AbortError')toast('分享未完成'); return; }
  }
  // 电脑端：逐个下载文件 + 打开WPS共享文件夹，用户拖进WPS即可
  list.filter(m=>m.dataUrl).forEach(function(m){
    const a=document.createElement('a');a.href=m.dataUrl;a.download=m.name||'file';a.click();
  });
  toast('文件已开始下载，正在打开WPS共享文件夹，下载完拖进去即可');
  setTimeout(function(){window.open('https://kdocs.cn/join/geg53tt?f=101','_blank');},800);
}
async function delMediaCloud(id){
  const m=DB.media.find(x=>x.id===id);
  if(m&&m.cloudUrl&&fbReady&&fbStorage){
    try{ await fbStorage.refFromURL(m.cloudUrl).delete(); }catch(e){}
  }
}

function imgToDataUrl(f,max,cb){
  if(!f)return;const img=new Image();const url=URL.createObjectURL(f);
  img.onload=()=>{let w=img.width,h=img.height;if(Math.max(w,h)>max){const r=max/Math.max(w,h);w=Math.round(w*r);h=Math.round(h*r);}
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);
    URL.revokeObjectURL(url);cb(cv.toDataURL('image/jpeg',0.85));};
  img.src=url;
}

    if(v.version&&v.version!==ERP_VERSION){
      if(confirm('发现新版本 '+v.version+'（当前'+ERP_VERSION+'）\n'+(v.note||'')+'\n\n是否下载更新？')){
        const a=document.createElement('a');a.href=v.url||'https://lisyu-d.github.io/chenli-erp-updates/index.html';a.download='chenli-erp-standalone.html';a.click();
        toast('已开始下载新版，下载后放到启动器目录即可自动更新');
      }
    }else{
      toast('已是最新版本（'+ERP_VERSION+'）');
    }
    if(el)el.innerHTML='<button class="btn sm" onclick="checkUpdate()">检查更新</button>';
  }).catch(e=>{
    toast('检查失败（需联网），当前版本'+ERP_VERSION);

  });
}

  const name=$('#cn_name').value.trim(), text=$('#cn_text').value.trim();
  if(!name||!text){alert('请填写预设名称和配置说明');return;}

  DB.settings.configNotes.push({id:uid('cn'),name:name,text:text});
  if(saveDB()){toast('预设已添加');renderSet();}
}
function delConfigNote(id){
  if(!confirm('确定删除这个预设？'))return;
  DB.settings.configNotes=(DB.settings.configNotes||[]).filter(function(c){return c.id!==id;});
  if(saveDB()){toast('已删除');renderSet();}

  const n=$('#ex_name').value.trim();if(!n){alert('请填写增项名称');return;}
  const data={name:n,unit:$('#ex_unit').value.trim()||'项',unitPrice:num($('#ex_price').value)||0,note:$('#ex_note').value.trim()};
  if(editExtraId){
    const e=(DB.extraLib||[]).find(x=>x.id===editExtraId);

function saveProduct(){
